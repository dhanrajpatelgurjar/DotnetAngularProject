<div class="card">
<form [formGroup]="addStudent" (ngSubmit)="saveStudent()"> 
    <div class="mb-3">
      <label for="form-control" class="form-label">Name</label>
    <input type="Name" class="form-control" formControlName="Name">
    </div>
    <div class="mb-3">
      <label for="date" class="form-label">Date</label>
      <input type="date" class="form-control" id="date" formControlName="Date">
    </div>
    <div class="mb-3 form-check">
      <input type="checkbox" class="form-check-input" id="complete" [value]="true" formControlName="Complete">
      <label class="form-check-label" for="complete">Complete !</label>
    </div>
    <button type="submit" class="form-control btn btn-primary" >Create</button>
  </form>
</div>
</div>
